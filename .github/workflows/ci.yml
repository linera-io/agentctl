name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. `branches: [main]` here meant a pull request based
  # on anything other than main — any stacked PR — ran no checks at all and
  # reported "no checks reported", which reads like success and is how #50 was
  # nearly merged unverified. Retargeting such a PR onto main does not fix it
  # either: `pull_request` fires on opened/synchronize/reopened, never `edited`.
  #
  # Duplicate runs are not a concern: `push` stays pinned to main, so a PR
  # branch is built once by `pull_request` and again only when it lands.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
